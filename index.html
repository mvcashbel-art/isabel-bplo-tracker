<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwywMsuR-0B4QO7arxzX2XBOgkTQIToUg5JmfVy_lP8sZ-pIe8-7Uok6M31R3HOJlY/exec";
  const ISABEL_CENTER = [10.9280, 124.4385];
  const ADMIN_PASSCODE = "admin123";

  const SAMPLE_BUSINESSES = [
    { id: "BIZ-001", name: "Isabel General Merchandise", owner: "Juan dela Cruz", address: "Brgy. Poblacion, Isabel", status: "Compliant", lat: 10.9280, lon: 124.4385, image: "https://placehold.co/100x100?text=Store+1" },
    { id: "BIZ-002", name: "Leyte Hardware & Supply", owner: "Pedro Penduko", address: "Brgy. Marvel, Isabel", status: "Expired", lat: 10.9295, lon: 124.4390, image: "https://placehold.co/100x100?text=Store+2" },
    { id: "BIZ-003", name: "Marvel Food Corner", owner: "Maria Clara", address: "Brgy. Marvel, Isabel", status: "No Permit", lat: 10.9265, lon: 124.4370, image: "https://placehold.co/100x100?text=Store+3" }
  ];

  let businesses = [];
  let activeUser = null;
  const markers = {};

  const colorMap = {
    "No Permit": "#ef4444",
    "Expired": "#f59e0b",
    "Pending Follow-Up": "#3b82f6",
    "Compliant": "#10b981"
  };

  try {
    const stored = localStorage.getItem('isabel_bplo_user');
    if (stored) activeUser = JSON.parse(stored);
  } catch (e) { activeUser = null; }

  const map = L.map('map').setView(ISABEL_CENTER, 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

  const selectElem = document.getElementById('businessSelect');
  const searchInput = document.getElementById('searchInput');

  window.toggleModal = function(modalId, show) {
    const el = document.getElementById(modalId);
    if (el) el.style.display = show ? 'flex' : 'none';
  };

  window.handleAuthClick = function() {
    if (activeUser) {
      activeUser = null;
      localStorage.removeItem('isabel_bplo_user');
      updateUserRoleUI();
      alert("Logged out successfully.");
    } else {
      toggleModal('authModal', true);
    }
  };

  function updateUserRoleUI() {
    const editableFields = document.querySelectorAll('.editable-field');
    const submitLogBtn = document.getElementById('submitLogBtn');
    const openAddModalBtn = document.getElementById('openAddModalBtn');
    const openAuthModalBtn = document.getElementById('openAuthModalBtn');

    if (activeUser) {
      document.getElementById('userProfileName').textContent = activeUser.name;
      document.getElementById('userProfilePosition').textContent = activeUser.position || "Inspector";
      openAuthModalBtn.textContent = "🔒 Logout";

      editableFields.forEach(f => {
        f.disabled = false;
        f.classList.remove('opacity-60', 'cursor-not-allowed');
      });

      submitLogBtn.disabled = false;
      submitLogBtn.textContent = "Save Inspection Log";
      submitLogBtn.classList.remove('bg-slate-400', 'cursor-not-allowed');
      submitLogBtn.classList.add('bg-blue-700');

      openAddModalBtn.classList.remove('hidden');
    } else {
      document.getElementById('userProfileName').textContent = "Guest User";
      document.getElementById('userProfilePosition').textContent = "Viewer (Read-Only)";
      openAuthModalBtn.textContent = "🔑 Login";

      editableFields.forEach(f => {
        f.disabled = true;
        f.classList.add('opacity-60', 'cursor-not-allowed');
      });

      submitLogBtn.disabled = true;
      submitLogBtn.textContent = "🔒 Log Changes Disabled (Read-Only)";
      submitLogBtn.classList.remove('bg-blue-700');
      submitLogBtn.classList.add('bg-slate-400', 'cursor-not-allowed');

      openAddModalBtn.classList.add('hidden');
    }
  }

  async function loadBusinesses() {
    let customSaved = [];
    try {
      customSaved = JSON.parse(localStorage.getItem('isabel_custom_businesses') || '[]');
    } catch(e) { customSaved = []; }

    try {
      const res = await fetch(GOOGLE_SCRIPT_URL);
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        businesses = [...customSaved, ...data.map(b => ({
          id: b["Business ID"] || b.id || `BIZ-${Math.random().toString(36).substr(2, 4)}`,
          name: b["Business Name"] || b.name,
          owner: b["Owner Name"] || b.owner,
          address: b["Barangay Address"] || b.address,
          status: b["Permit Status"] || b.status || "No Permit",
          lat: parseFloat(b["Latitude"] || b.lat) || ISABEL_CENTER[0],
          lon: parseFloat(b["Longitude"] || b.lon) || ISABEL_CENTER[1],
          image: b["Photo URL"] || b.image || "https://placehold.co/100x100?text=No+Photo"
        }))];
      } else {
        businesses = [...customSaved, ...SAMPLE_BUSINESSES];
      }
    } catch (err) {
      businesses = [...customSaved, ...SAMPLE_BUSINESSES];
    }
    renderBusinessList(businesses);
  }

  function renderBusinessList(list) {
    selectElem.innerHTML = '';
    Object.values(markers).forEach(m => map.removeLayer(m));

    if (list.length === 0) {
      selectElem.appendChild(new Option("No business found", ""));
      updateDetailCard(null);
      return;
    }

    list.forEach(biz => {
      selectElem.appendChild(new Option(`${biz.name} (${biz.status})`, biz.id));
      addMarker(biz);
    });
    updateDetailCard(list[0]);
  }

  function addMarker(biz) {
    const marker = L.circleMarker([biz.lat, biz.lon], {
      radius: 9,
      fillColor: colorMap[biz.status] || '#6b7280',
      color: '#ffffff',
      weight: 2,
      fillOpacity: 0.95
    }).addTo(map);

    marker.bindPopup(`<b>${biz.name}</b><br>Owner: ${biz.owner}<br>Status: ${biz.status}`);
    markers[biz.id] = marker;
  }

  function updateDetailCard(biz) {
    if (!biz) {
      document.getElementById('cardOwner').textContent = '-';
      document.getElementById('cardAddress').textContent = '-';
      document.getElementById('cardStatus').textContent = '-';
      document.getElementById('cardImage').src = 'https://placehold.co/100x100?text=No+Photo';
      return;
    }
    document.getElementById('cardOwner').textContent = biz.owner;
    document.getElementById('cardAddress').textContent = biz.address;
    document.getElementById('cardStatus').textContent = biz.status;
    document.getElementById('statusSelect').value = biz.status;
    document.getElementById('cardImage').src = biz.image || 'https://placehold.co/100x100?text=No+Photo';
    document.getElementById('getDirectionsBtn').href = `https://www.google.com/maps/dir/?api=1&destination=${biz.lat},${biz.lon}`;
  }

  // 🖼️ IMAGE COMPRESSION FUNCTION (Prevents LocalStorage Quota Errors)
  function compressImage(file, maxWidth, quality, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        callback(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  window.deleteSelectedBusiness = function() {
    const selectedId = selectElem.value;
    if (!selectedId) return;

    const targetIndex = businesses.findIndex(b => b.id === selectedId);
    if (targetIndex !== -1) {
      const removed = businesses.splice(targetIndex, 1)[0];
      
      let customSaved = JSON.parse(localStorage.getItem('isabel_custom_businesses') || '[]');
      customSaved = customSaved.filter(b => b.id !== selectedId);
      localStorage.setItem('isabel_custom_businesses', JSON.stringify(customSaved));

      renderBusinessList(businesses);
      alert(`Deleted ${removed.name} successfully.`);
    }
  };

  window.clearAllCustomData = function() {
    if (confirm("Are you sure you want to clear all locally added businesses?")) {
      localStorage.removeItem('isabel_custom_businesses');
      loadBusinesses();
      alert("All local business entries cleared.");
    }
  };

  window.detectGPS = function() {
    if ("geolocation" in navigator) {
      document.getElementById('gpsBtnText').textContent = "Locating GPS...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById('newBizLat').value = pos.coords.latitude.toFixed(6);
          document.getElementById('newBizLon').value = pos.coords.longitude.toFixed(6);
          document.getElementById('gpsBtnText').textContent = "Location Acquired!";
        },
        () => {
          document.getElementById('newBizLat').value = ISABEL_CENTER[0];
          document.getElementById('newBizLon').value = ISABEL_CENTER[1];
          document.getElementById('gpsBtnText').textContent = "Used Default Isabel Center";
        }
      );
    }
  };

  // Form Submissions
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('loginNameInput').value.trim();
    activeUser = { name: name, position: "Field Inspector II" };
    localStorage.setItem('isabel_bplo_user', JSON.stringify(activeUser));
    updateUserRoleUI();
    toggleModal('authModal', false);
    alert(`Welcome back, ${name}! Inspector controls enabled.`);
  });

  document.getElementById('addBusinessForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const photoInput = document.getElementById('newBizPhoto');
    const file = photoInput.files[0];

    const saveBusinessData = (imageUrl) => {
      const newBiz = {
        id: `BIZ-${Math.floor(Math.random() * 9000 + 1000)}`,
        name: document.getElementById('newBizName').value.trim(),
        owner: document.getElementById('newBizOwner').value.trim(),
        address: document.getElementById('newBizAddress').value.trim(),
        status: document.getElementById('newBizStatus').value,
        lat: parseFloat(document.getElementById('newBizLat').value) || ISABEL_CENTER[0],
        lon: parseFloat(document.getElementById('newBizLon').value) || ISABEL_CENTER[1],
        image: imageUrl
      };

      businesses.unshift(newBiz);

      try {
        const customSaved = JSON.parse(localStorage.getItem('isabel_custom_businesses') || '[]');
        customSaved.unshift(newBiz);
        localStorage.setItem('isabel_custom_businesses', JSON.stringify(customSaved));
      } catch (storageErr) {
        console.warn("Storage full, saved to session only:", storageErr);
      }

      renderBusinessList(businesses);
      selectElem.value = newBiz.id;
      updateDetailCard(newBiz);
      map.panTo([newBiz.lat, newBiz.lon]);

      toggleModal('addBusinessModal', false);
      document.getElementById('addBusinessForm').reset();
      alert(`Successfully added and pinned "${newBiz.name}"!`);
    };

    if (file) {
      // Compress photo to 400px width at 70% JPEG quality
      compressImage(file, 400, 0.7, function(compressedBase64) {
        saveBusinessData(compressedBase64);
      });
    } else {
      saveBusinessData("https://placehold.co/100x100?text=No+Photo");
    }
  });

  selectElem.addEventListener('change', (e) => {
    const target = businesses.find(b => b.id === e.target.value);
    if (target) {
      updateDetailCard(target);
      if (markers[target.id]) {
        map.panTo([target.lat, target.lon]);
        markers[target.id].openPopup();
      }
    }
  });

  searchInput.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = businesses.filter(b => 
      b.name.toLowerCase().includes(q) || 
      b.owner.toLowerCase().includes(q) || 
      b.address.toLowerCase().includes(q)
    );
    renderBusinessList(filtered);
  });

  // Initial Execution
  updateUserRoleUI();
  loadBusinesses();
</script>
