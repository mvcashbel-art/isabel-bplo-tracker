<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isabel BPLO - Permit Field Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 320px; width: 100%; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-3 max-w-md mx-auto">

  <!-- Header & Role Selector -->
  <header class="bg-blue-700 text-white p-4 rounded-xl shadow-md mb-4">
    <div class="flex justify-between items-center mb-3">
      <div>
        <h1 class="text-lg font-bold">Isabel BPLO Tracker</h1>
        <p class="text-xs text-blue-200">Business Permit & Licensing Office</p>
      </div>
      <span class="bg-blue-800 text-xs px-2.5 py-1 rounded-full border border-blue-500 font-mono">Isabel, Leyte</span>
    </div>

    <!-- 🔑 Role Access Switcher -->
    <div class="flex items-center justify-between bg-blue-800/80 p-2 rounded-lg border border-blue-600/50 text-xs">
      <span class="font-medium text-blue-100">User Access Mode:</span>
      <select id="userRoleSelect" class="bg-white text-slate-800 px-2 py-1 rounded font-semibold text-xs outline-none cursor-pointer">
        <option value="inspector">👮 Inspector (Full Access)</option>
        <option value="viewer">👁️ Viewer (Read Only)</option>
      </select>
    </div>
  </header>

  <!-- Field Inspection Log & Search -->
  <section class="bg-white p-4 rounded-xl shadow-sm mb-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-sm font-bold text-slate-700">📝 Field Inspection Log</h2>
      <button id="openAddModalBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium transition flex items-center gap-1 shadow-sm">
        <span>➕</span> Add Business
      </button>
    </div>
    
    <!-- 🔍 SEARCH BAR -->
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-600 mb-1">Search Business / Barangay / Owner</label>
      <div class="relative">
        <input type="text" id="searchInput" placeholder="Type name, owner, or barangay..." class="w-full text-sm p-2.5 pl-8 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        <span class="absolute left-2.5 top-2.5 text-slate-400 text-xs">🔍</span>
      </div>
    </div>

    <form id="inspectionForm" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Select Establishment</label>
        <select id="businessSelect" class="w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <!-- Populated dynamically -->
        </select>
      </div>

      <!-- Business Details Box (Read-Only Preview with Storefront Image) -->
      <div id="businessDetailCard" class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs space-y-2">
        <div class="flex gap-3 items-center">
          <img id="cardImage" src="https://placehold.co/100x100?text=No+Photo" class="w-16 h-16 rounded-lg object-cover border border-slate-300 bg-slate-200" alt="Storefront">
          <div class="space-y-0.5">
            <div><span class="font-semibold text-slate-500">Owner:</span> <span id="cardOwner" class="text-slate-800 font-medium">-</span></div>
            <div><span class="font-semibold text-slate-500">Address:</span> <span id="cardAddress" class="text-slate-800 font-medium">-</span></div>
            <div><span class="font-semibold text-slate-500">Status:</span> <span id="cardStatus" class="font-bold text-slate-800">-</span></div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Permit Status</label>
          <select id="statusSelect" class="editable-field w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="No Permit">🔴 No Permit</option>
            <option value="Expired">🟡 Expired / Overdue</option>
            <option value="Pending Follow-Up">🔵 Pending Compliance</option>
            <option value="Compliant">🟢 Active Permit</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Action Taken</label>
          <select id="outcomeSelect" class="editable-field w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Notice Served">Notice Served</option>
            <option value="Verified Active">Verified Active</option>
            <option value="Closed/Unlocated">Closed Storefront</option>
            <option value="Refused Inspection">Refused Entry</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Inspector Remarks / Barangay Notes</label>
        <textarea id="inspectorNotes" rows="2" class="editable-field w-full text-sm p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Add compliance details or citation reference..."></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Upload Citation/Storefront Photo</label>
        <input type="file" id="photoInput" accept="image/*" capture="environment" class="editable-field w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
      </div>

      <button type="submit" id="submitLogBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">Save Inspection Log</button>
    </form>
  </section>

  <!-- Interactive Map Section -->
  <section class="bg-white p-3 rounded-xl shadow-sm mb-4">
    <div class="flex justify-between items-center mb-2">
      <h2 class="text-sm font-bold text-slate-700">📍 Isabel Municipal Map</h2>
      <div class="flex gap-2 text-[10px]">
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500"></span> No Permit</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Expired</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Active</span>
      </div>
    </div>
    <div id="map"></div>
  </section>

  <!-- Inspection History -->
  <section class="bg-white p-4 rounded-xl shadow-sm mb-6">
    <h2 class="text-sm font-bold text-slate-700 mb-2">📋 BPLO Log Activity</h2>
    <div id="logHistory" class="space-y-2 text-xs divide-y divide-slate-100">
      <p class="text-slate-400 italic py-2">No inspections recorded today yet.</p>
    </div>
  </section>

  <!-- ➕ ADD BUSINESS MODAL WITH GPS & PHOTO UPLOAD -->
  <div id="addBusinessModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-4 space-y-3 my-auto max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-sm font-bold text-slate-800">➕ Add New Business</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>
      
      <form id="addBusinessForm" class="space-y-2.5 text-xs">
        <div>
          <label class="block font-semibold text-slate-600 mb-1">Business Name *</label>
          <input type="text" id="newBizName" required placeholder="e.g. Isabel Snack Shack" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block font-semibold text-slate-600 mb-1">Owner Name *</label>
          <input type="text" id="newBizOwner" required placeholder="e.g. Juan dela Cruz" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block font-semibold text-slate-600 mb-1">Barangay / Address *</label>
          <input type="text" id="newBizAddress" required placeholder="e.g. Brgy. Marvel, Isabel" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block font-semibold text-slate-600 mb-1">Initial Permit Status</label>
          <select id="newBizStatus" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg outline-none">
            <option value="No Permit">🔴 No Permit</option>
            <option value="Expired">🟡 Expired</option>
            <option value="Pending Follow-Up">🔵 Pending Compliance</option>
            <option value="Compliant">🟢 Active Permit</option>
          </select>
        </div>

        <!-- 📷 Photo Upload with Camera & Preview -->
        <div>
          <label class="block font-semibold text-slate-600 mb-1">Storefront Photo</label>
          <input type="file" id="newBizPhoto" accept="image/*" capture="environment" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700">
          <div id="photoPreviewContainer" class="hidden mt-2">
            <img id="photoPreview" class="w-full h-28 object-cover rounded-lg border border-slate-200" alt="Preview">
          </div>
        </div>

        <!-- 📍 Automatic GPS Location Button -->
        <div class="space-y-1">
          <label class="block font-semibold text-slate-600">Location Coordinates</label>
          <button type="button" id="getGpsBtn" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold py-2 px-3 rounded-lg border border-blue-200 flex items-center justify-center gap-2 transition">
            <span>📡</span> <span id="gpsBtnText">Detect Current GPS Location</span>
          </button>
          
          <div class="grid grid-cols-2 gap-2 mt-1">
            <input type="number" step="any" id="newBizLat" placeholder="Latitude" class="p-2 bg-slate-50 border border-slate-200 rounded-lg outline-none text-[11px]" readonly>
            <input type="number" step="any" id="newBizLon" placeholder="Longitude" class="p-2 bg-slate-50 border border-slate-200 rounded-lg outline-none text-[11px]" readonly>
          </div>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-xs transition shadow-sm mt-3">Save & Pin Business</button>
      </form>
    </div>
  </div>

  <!-- App Script -->
  <script>
    const ISABEL_CENTER = [10.9280, 124.4385];

    let businesses = [
      { id: 'BIZ-101', name: "Isabel Commercial Store", owner: "Juan Dela Cruz", status: "No Permit", lat: 10.9285, lon: 124.4380, address: "Poblacion, Isabel, Leyte", image: "https://images.unsplash.com/photo-1534723452862-4c874018d66d?w=150" },
      { id: 'BIZ-102', name: "Isabel Bay Mart", owner: "Maria Santos", status: "Expired", lat: 10.9272, lon: 124.4395, address: "Near Port, Isabel", image: "https://images.unsplash.com/photo-1578916171728-46686eac8d58?w=150" },
      { id: 'BIZ-103', name: "Leyte Hardware & Supply", owner: "Pedro Penduko", status: "Compliant", lat: 10.9295, lon: 124.4370, address: "Barangay Marvel, Isabel", image: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=150" }
    ];

    const colorMap = {
      "No Permit": "#ef4444",
      "Expired": "#f59e0b",
      "Pending Follow-Up": "#3b82f6",
      "Compliant": "#10b981"
    };

    // Initialize Map
    const map = L.map('map').setView(ISABEL_CENTER, 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const markers = {};
    const selectElem = document.getElementById('businessSelect');
    const searchInput = document.getElementById('searchInput');

    function renderBusinessList(filteredList) {
      selectElem.innerHTML = '';
      if(filteredList.length === 0) {
        const option = document.createElement('option');
        option.textContent = "No business found";
        selectElem.appendChild(option);
        updateDetailCard(null);
        return;
      }

      filteredList.forEach(biz => {
        const option = document.createElement('option');
        option.value = biz.id;
        option.textContent = `${biz.name} (${biz.status})`;
        selectElem.appendChild(option);
      });

      updateDetailCard(filteredList[0]);
    }

    function addMarker(biz) {
      const marker = L.circleMarker([biz.lat, biz.lon], {
        radius: 9,
        fillColor: colorMap[biz.status] || '#6b7280',
        color: '#ffffff',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.95
      }).addTo(map);

      marker.bindPopup(`
        <div style="font-family: sans-serif; min-width: 130px;">
          <img src="${biz.image || 'https://placehold.co/100x100?text=No+Photo'}" style="width:100%; height:70px; object-fit:cover; border-radius:6px; margin-bottom:5px;">
          <b style="font-size:12px;">${biz.name}</b><br>
          <span style="font-size:10px; color:#444;">Owner: ${biz.owner}</span><br>
          <span style="font-size:10px;">Status: <b>${biz.status}</b></span>
        </div>
      `);
      markers[biz.id] = marker;
    }

    function updateDetailCard(biz) {
      if(!biz) {
        document.getElementById('cardOwner').textContent = '-';
        document.getElementById('cardAddress').textContent = '-';
        document.getElementById('cardStatus').textContent = '-';
        document.getElementById('cardImage').src = 'https://placehold.co/100x100?text=No+Photo';
        return;
      }
      document.getElementById('cardOwner').textContent = biz.owner;
      document.getElementById('cardAddress').textContent = biz.address;
      document.getElementById('cardStatus').textContent = biz.status;
      document.getElementById('statusSelect').value = biz.status;
      document.getElementById('cardImage').src = biz.image || 'https://placehold.co/100x100?text=No+Photo';
    }

    businesses.forEach(addMarker);
    renderBusinessList(businesses);

    // Search Logic
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = businesses.filter(b => 
        b.name.toLowerCase().includes(query) || 
        b.owner.toLowerCase().includes(query) || 
        b.address.toLowerCase().includes(query) ||
        b.status.toLowerCase().includes(query)
      );

      renderBusinessList(filtered);

      if (filtered.length > 0) {
        const topMatch = filtered[0];
        map.panTo([topMatch.lat, topMatch.lon]);
        markers[topMatch.id].openPopup();
      }
    });

    selectElem.addEventListener('change', (e) => {
      const bizId = e.target.value;
      const targetBiz = businesses.find(b => b.id === bizId);
      if (targetBiz && markers[bizId]) {
        updateDetailCard(targetBiz);
        map.panTo([targetBiz.lat, targetBiz.lon]);
        markers[bizId].openPopup();
      }
    });

    // 🔒 Role Permissions
    const userRoleSelect = document.getElementById('userRoleSelect');
    const editableFields = document.querySelectorAll('.editable-field');
    const submitLogBtn = document.getElementById('submitLogBtn');
    const openAddModalBtn = document.getElementById('openAddModalBtn');

    userRoleSelect.addEventListener('change', (e) => {
      const isViewer = (e.target.value === 'viewer');
      editableFields.forEach(field => {
        field.disabled = isViewer;
        if(isViewer) field.classList.add('opacity-60', 'cursor-not-allowed');
        else field.classList.remove('opacity-60', 'cursor-not-allowed');
      });

      if(isViewer) {
        submitLogBtn.disabled = true;
        submitLogBtn.textContent = "🔒 Log Changes Disabled (Read-Only)";
        submitLogBtn.classList.replace('bg-blue-700', 'bg-slate-400');
        openAddModalBtn.classList.add('hidden');
      } else {
        submitLogBtn.disabled = false;
        submitLogBtn.textContent = "Save Inspection Log";
        submitLogBtn.classList.replace('bg-slate-400', 'bg-blue-700');
        openAddModalBtn.classList.remove('hidden');
      }
    });

    // Modal & GPS/Photo Logic
    const modal = document.getElementById('addBusinessModal');
    openAddModalBtn.addEventListener('click', () => modal.classList.replace('hidden', 'flex'));
    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.replace('flex', 'hidden'));

    // 📡 Automatic GPS Detection
    const getGpsBtn = document.getElementById('getGpsBtn');
    const gpsBtnText = document.getElementById('gpsBtnText');
    const latInput = document.getElementById('newBizLat');
    const lonInput = document.getElementById('newBizLon');

    getGpsBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      gpsBtnText.textContent = "Detecting GPS Location...";
      getGpsBtn.classList.add("opacity-75");

      navigator.geolocation.getCurrentPosition(
        (position) => {
          latInput.value = position.coords.latitude.toFixed(6);
          lonInput.value = position.coords.longitude.toFixed(6);
          gpsBtnText.textContent = "✅ GPS Location Locked!";
          getGpsBtn.classList.replace("bg-blue-50", "bg-emerald-50");
          getGpsBtn.classList.replace("text-blue-700", "text-emerald-700");
        },
        (error) => {
          gpsBtnText.textContent = "Detect Current GPS Location";
          alert("Error obtaining GPS position. Please ensure Location permissions are allowed on your browser/phone.");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    // 📷 Photo File Upload Live Preview (Base64)
    let uploadedImageBase64 = "";
    const photoInput = document.getElementById('newBizPhoto');
    const photoPreview = document.getElementById('photoPreview');
    const previewContainer = document.getElementById('photoPreviewContainer');

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          uploadedImageBase64 = evt.target.result;
          photoPreview.src = uploadedImageBase64;
          previewContainer.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    // Save New Business
    document.getElementById('addBusinessForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newLat = parseFloat(latInput.value) || ISABEL_CENTER[0];
      const newLon = parseFloat(lonInput.value) || ISABEL_CENTER[1];
      const newId = `BIZ-${Date.now().toString().slice(-4)}`;

      const newBiz = {
        id: newId,
        name: document.getElementById('newBizName').value,
        owner: document.getElementById('newBizOwner').value,
        address: document.getElementById('newBizAddress').value,
        status: document.getElementById('newBizStatus').value,
        lat: newLat,
        lon: newLon,
        image: uploadedImageBase64 || "https://placehold.co/100x100?text=No+Photo"
      };

      businesses.push(newBiz);
      addMarker(newBiz);
      renderBusinessList(businesses);

      // Focus on newly added item
      selectElem.value = newId;
      updateDetailCard(newBiz);
      map.panTo([newLat, newLon]);
      markers[newId].openPopup();

      // Reset modal inputs
      e.target.reset();
      uploadedImageBase64 = "";
      previewContainer.classList.add('hidden');
      gpsBtnText.textContent = "Detect Current GPS Location";
      getGpsBtn.classList.replace("bg-emerald-50", "bg-blue-50");
      getGpsBtn.classList.replace("text-emerald-700", "text-blue-700");
      modal.classList.replace('flex', 'hidden');

      alert(`Successfully added ${newBiz.name} with GPS position and storefront photo!`);
    });

    // Inspection Form Submission
    const form = document.getElementById('inspectionForm');
    const historyContainer = document.getElementById('logHistory');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const bizId = selectElem.value;
      const selectedBiz = businesses.find(b => b.id === bizId);
      if (!selectedBiz) return;

      const newStatus = document.getElementById('statusSelect').value;
      const outcome = document.getElementById('outcomeSelect').value;
      const notes = document.getElementById('inspectorNotes').value;
      const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      selectedBiz.status = newStatus;
      updateDetailCard(selectedBiz);

      if (markers[bizId]) {
        markers[bizId].setStyle({ fillColor: colorMap[newStatus] });
      }

      if (historyContainer.querySelector('p')) {
        historyContainer.innerHTML = '';
      }

      const logItem = document.createElement('div');
      logItem.className = 'py-2 flex flex-col gap-1';
      logItem.innerHTML = `
        <div class="flex justify-between items-center font-semibold">
          <span class="text-slate-800">${selectedBiz.name}</span>
          <span class="text-[10px] text-slate-400">${timestamp}</span>
        </div>
        <div class="flex gap-2 items-center">
          <span class="px-1.5 py-0.5 rounded text-[10px] text-white" style="background-color: ${colorMap[newStatus]}">${newStatus}</span>
          <span class="text-slate-600">${outcome}</span>
        </div>
        ${notes ? `<p class="text-slate-500 italic text-[11px]">"${notes}"</p>` : ''}
      `;

      historyContainer.prepend(logItem);

      document.getElementById('inspectorNotes').value = '';
      document.getElementById('photoInput').value = '';
      alert(`Inspection log updated for ${selectedBiz.name}!`);
    });
  </script>
</body>
</html>
